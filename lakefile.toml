name = "SpinGlass"
defaultTargets = ["SpinGlass", "Common"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0-rc2"

# Exchangeability, the Hewitt-Savage zero-one law and de Finetti's theorem (Dynkin form, with
# uniqueness over a standard Borel space) are absent from Mathlib and proved on this branch.
# They are the ancestors of Aldous-Hoover and Dovbysh-Sudakov, which Talagrand Vol. II Ch. 12-15
# needs. Only that layer is used here; the DLR/specification half of the repo is not imported.
[[require]]
name = "GibbsMeasure"
git = "https://github.com/matteo-ax/GibbsMeasure.git"
rev = "8a158f018c55665542e071c6c0e54906f903a199"

[[lean_lib]]
name = "SpinGlass"

[[lean_lib]]
name = "Common"
