rev = "v4.29.0"

[[require]]
name = "LeanArchitect"
git = "https://github.com/hanwenzhu/LeanArchitect.git"
rev = "719ea595bb100be70d0b53b01eca828862d9f860"

[[require]]
name = "GibbsMeasure"
git = "https://github.com/or4nge19/GibbsMeasure.git"
rev = "mc3"

[[lean_lib]]
name = "SpinGlass"

[[lean_lib]]
name = "Common"
